<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Powiadomienia</title>
<link rel="manifest" href="manifest.json" />
<script src="notification.js" defer></script>
</head>
<body>
<h1>Notification API</h1>
<p>Uprawnienie do powiadomień: <strong id="permission">?</strong></p>
<button id="enable">Włącz powiadomienia</button>
<button id="local">Powiadomienie ze strony</button>
<button id="sw">Powiadomienie z service workera</button>
<h2>Web Push</h2>
<button id="subscribe">Subskrybuj powiadomienia push</button>
<button id="unsubscribe">Anuluj subskrypcję</button>
<p>
<label for="subscription">Subskrypcja (skopiuj do pliku lab_02/subscription.json):
</label><br />
<textarea id="subscription" rows="10" cols="60" readonly></textarea>
</p>
<button id="copy">Kopiuj subskrypcję</button>
<hr>
<section>
    <h1>Wyślij powiadomienie</h1>
    <form id="powiadomienieform">
        <label for="title">Tytuł (wymagany)</label><br>
        <input type="text" id="title" required placeholder="Tu wpisz tytuł (wymagany)"><br><br>
        <label for="body">Treść</label><br>
        <input type="text" id="body" placeholder="Tu wpisz treść"><br><br>
        <label for="obrazek">Wybierz ikonę powiadomienia</label><br>
        <select id="obrazek">
            <option value="./icons/apple-icon-180.png">apple-icon-180.png</option>
            <option value="./icons/manifest-icon-192.maskable.png">manifest-icon-192.maskable.png</option>
            <option value="./icons/manifest-icon-512.maskable.png">manifest-icon-512.maskable.png</option>
        </select><br><br>
        <button type="submit">Wyślij powiadomienie</button>
    </form>
</section>
</body>
</html>
